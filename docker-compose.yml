services:
  db:
    image: postgres:16
    container_name: taskpilot_db
    environment:
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot
      POSTGRES_DB: taskpilot
    ports:
      - "5433:5432"
    volumes:
      - taskpilot_pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: taskpilot_db_test
    environment:
      POSTGRES_USER: taskpilot_test
      POSTGRES_PASSWORD: taskpilot_test
      POSTGRES_DB: taskpilot_test
    ports:
      - "5434:5432"
    volumes:
      - taskpilot_test_pgdata:/var/lib/postgresql/data

volumes:
  taskpilot_pgdata:
  taskpilot_test_pgdata:
